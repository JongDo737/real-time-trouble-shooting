  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      MYSQL_HOST: mariadb
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    expose:
      - "8080"
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    restart: unless-stopped

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    environment:
      TZ: UTC
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FAISS_DIR: /rag_pipeline/faiss_db/pdf

    volumes:
      - ./rag_pipeline/faiss_db/pdf:/rag_pipeline/faiss_db/pdf:ro
    expose:
      - "8001"
    ports:
      - "8001:8001"
    restart: unless-stopped

  voice:
    build: ./voice
    environment:
      JWT_SECRET: ${JWT_SECRET}
      WHISPER_MODEL: tiny
    volumes:
      - whisper_models:/models
    expose:
      - "8008"
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --default-time-zone=+00:00
    restart: unless-stopped

volumes:
  mariadb_data:
  whisper_models:
