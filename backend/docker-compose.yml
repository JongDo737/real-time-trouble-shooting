# 로컬 백엔드 개발용: nginx + mariadb만 기동 (Spring은 IDE · ./gradlew bootRun으로 호스트에서 실행)
# docker compose --env-file ../.env up -d --build
# nginx는 http://localhost/backend/api/ , ws://localhost/backend/ws 를 호스트 8080으로 넘긴다

services:
  nginx:
    container_name: realshoot
    build:
      context: ../nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      TZ: UTC
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mariadb
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --default-time-zone=+00:00
    restart: unless-stopped

volumes:
  mariadb_data:
