spring.application.name=backend
server.port=8080

# 실제 값은 서버 환경변수로 주입 (비밀번호 · 키를 여기에 쓰지 말 것)
spring.datasource.url=jdbc:mariadb://${MYSQL_HOST:mariadb}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:realshoot}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# 테이블은 JPA 엔티티로 생성 (backend-api.md §11 테이블 · 컬럼 이름 그대로)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=${JWT_SECRET}
jwt.expires-in=${JWT_EXPIRES_IN:3600}

rag.base-url=http://realshoot/fastapi
# RAG 내부 LLM 타임아웃(10초)보다 길게 — 그래야 503 LLM_TIMEOUT을 받아 1회 재시도할 수 있다
rag.translate-timeout=12s
# RAG 자체 상한 15초 + 여유. LLM_TIMEOUT 재시도 포함 최대 약 60초 대기
rag.query-timeout=30s

call.missed-timeout=${CALL_MISSED_TIMEOUT:60}

springdoc.swagger-ui.path=/swagger-ui.html\